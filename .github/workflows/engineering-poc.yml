name: PDF Page Duplicator Windows POC

on:
  push:
    branches: [main, engineering/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-poc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned PDFsharp
        run: dotnet restore src/PdfPageDuplicator.Poc.csproj
      - name: Compile C# POC
        run: dotnet build src/PdfPageDuplicator.Poc.csproj -c Release --no-restore
      - name: Geometry self-test
        run: dotnet run --project src/PdfPageDuplicator.Poc.csproj -c Release --no-build -- --self-test
      - name: Install independent validator (CI only)
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: End-to-end PDF output verification
        run: python tests/verify_poc.py
      - name: Publish standalone x64 test executable
        run: dotnet publish src/PdfPageDuplicator.Poc.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - name: Self-test standalone executable
        run: .\dist\WinPebble.PDFPageDuplicator.POC.exe --self-test
      - name: Upload test executable (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Page-Duplicator-POC-win-x64
          path: dist/
