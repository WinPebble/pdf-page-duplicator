name: PDF Page Duplicator MSIX Packaging Gate
on:
  push:
    branches: [feature/wpf-options-ui]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-preview:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify unsigned full MSIX build
        shell: pwsh
        run: .\packaging\Build-MSIX-Preview.ps1
      - name: Upload only for packaging inspection - DO NOT INSTALL
        uses: actions/upload-artifact@v7
        with:
          name: PDF-Page-Duplicator-UNSIGNED-MSIX-GATE-ONLY
          path: artifacts/msix-preview/out/
          if-no-files-found: error
